<!DOCTYPE html>
<html>
<body>
<pre id="log"></pre>
<script>
  let frames = 0;
  let start = performance.now();
  function loop() {
    frames++;
    let now = performance.now();
    if (frames % 10 === 0) {
      document.getElementById('log').textContent += `f=${frames} t=${now.toFixed(1)} dt=${(now - start).toFixed(1)}\n`;
      start = now;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
