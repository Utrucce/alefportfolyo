<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Apex Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #070e17; color: #fff; font-family: sans-serif; overflow: hidden; width: 1280px; height: 800px; }
    #bgContainer { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    #bgContainer img { width: 100%; height: 100%; object-fit: cover; opacity: 0.4; }
    #butterflyThreeCanvas { position: fixed; inset: 0; z-index: 10; pointer-events: none; width: 1280px; height: 800px; }
    #whaleThreeCanvas { position: fixed; inset: 0; z-index: 30; pointer-events: none; width: 1280px; height: 800px; }
    #rainyGlassContainer { position: fixed; inset: 0; z-index: 45; pointer-events: none; width: 1280px; height: 800px; }
    #screenSplashCanvas { position: fixed; inset: 0; z-index: 50; pointer-events: none; width: 1280px; height: 800px; }
    .content { position: relative; z-index: 20; padding: 60px 40px; max-width: 900px; margin: 0 auto; }
    .card { background: rgba(13, 27, 42, 0.7); border: 1px solid rgba(0, 242, 254, 0.3); padding: 24px; border-radius: 16px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div id="bgContainer">
    <img id="nanoBgRef" src="../assets/site_bg_nano.png" alt="Nano BG">
  </div>

  <canvas id="butterflyThreeCanvas"></canvas>
  <canvas id="whaleThreeCanvas"></canvas>
  <div id="rainyGlassContainer"></div>
  <canvas id="screenSplashCanvas"></canvas>

  <div class="content">
    <div class="card">
      <h1>ALΣF 3B WebGL Kambur Balina & Eterik Kelebekler</h1>
      <p>Photorealistic 3B Three.js Kambur Balina, 3B Morfo Kelebekleri ve RainyDay.js optik su lensi.</p>
    </div>
  </div>

  <script src="../assets/three.min.js"></script>
  <script src="../assets/rainyday.min.js"></script>
  <script src="integrated_engine.js"></script>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        if (whaleEngineInstance) {
          whaleEngineInstance.seekProgress(0.5); // APEX (Merkez Tepe Noktası)
        }
        triggerRealWaterSplash(); // Islanma Damlacıkları
      }, 300);
    });
  </script>
</body>
</html>
