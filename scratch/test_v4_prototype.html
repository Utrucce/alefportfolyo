<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>ALΣF V4 Prototype Test</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    /* Okyanus Dalgaları & Şimşek Stilleri */
    #oceanWavesCanvas {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 180px;
      z-index: 22;
      pointer-events: none;
    }
    #lightningFlashOverlay {
      position: fixed;
      inset: 0;
      z-index: 85;
      pointer-events: none;
      opacity: 0;
      background: #e0f4ff;
      mix-blend-mode: screen;
      transition: opacity 0.05s ease-out;
    }
    #whaleThreeCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 35;
      pointer-events: none;
    }
    #butterflyContainer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 18;
      overflow: hidden;
    }
    .real-butterfly {
      position: absolute;
      top: 0;
      left: 0;
      width: 55px;
      height: 55px;
      pointer-events: none;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .butterfly-3d-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      perspective: 600px;
    }
    .wing-3d {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      backface-visibility: visible;
    }
    .wing-3d.wing-left {
      left: 0;
      transform-origin: right center;
      animation: flapLeftWing 0.22s ease-in-out infinite alternate;
    }
    .wing-3d.wing-right {
      right: 0;
      left: auto;
      transform-origin: left center;
      animation: flapRightWing 0.22s ease-in-out infinite alternate;
    }
    .wing-3d img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 4px 10px rgba(0, 242, 254, 0.45));
    }
    @keyframes flapLeftWing {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(68deg); }
    }
    @keyframes flapRightWing {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(-68deg); }
    }
    #screenSplashCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 55;
      pointer-events: none;
    }
  </style>
</head>
<body style="min-height: 200vh;">

  <!-- Şimşek Katmanı -->
  <div id="lightningFlashOverlay"></div>

  <!-- Fotoğrafik 3B Kelebekler -->
  <div id="butterflyContainer"></div>

  <!-- Dalgalı Okyanus Tuvali -->
  <canvas id="oceanWavesCanvas"></canvas>

  <!-- Three.js 3B Kambur Balina Tuvali -->
  <canvas id="whaleThreeCanvas"></canvas>

  <!-- Islanma & Cam Damlacıkları Tuvali -->
  <canvas id="screenSplashCanvas"></canvas>

  <div class="container" style="position:relative; z-index:40; padding:60px 20px; max-width:900px; margin:0 auto;">
    <div style="background:rgba(13,27,42,0.85); border:1px solid #00f2fe; padding:30px; border-radius:16px;">
      <h1>ALΣF V4 Doğal Okyanus, Şimşek & 3B Balina</h1>
      <p>Fotoğrafik Morfo kelebekleri, dalgalı okyanus, gök gürültülü şimşek, detaylı 3B balina ve gerçekçi cam ıslanması.</p>
    </div>
  </div>

  <script src="../assets/three.min.js"></script>
  <script src="../assets/rainyday.min.js"></script>
</body>
</html>
