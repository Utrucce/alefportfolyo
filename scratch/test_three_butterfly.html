<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>3D Butterfly Test</title>
  <style>
    body { margin: 0; background: #070e17; overflow: hidden; width: 1280px; height: 720px; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div id="container" style="width: 1280px; height: 720px;">
    <canvas id="bfCanvas"></canvas>
  </div>

  <script src="../assets/three.min.js"></script>
  <script>
    const width = 1280;
    const height = 720;
    const canvas = document.getElementById('bfCanvas');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.set(0, 0, 25);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(1);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 10, 10);
    scene.add(dirLight);

    const textureLoader = new THREE.TextureLoader();
    const leftTex = textureLoader.load('../assets/real_wing_left_blue.png');
    const rightTex = textureLoader.load('../assets/real_wing_right_blue.png');

    function createButterfly(leftT, rightT) {
      const group = new THREE.Group();

      // Body
      const bodyGeo = new THREE.CylinderGeometry(0.08, 0.05, 1.4, 8);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.rotation.x = Math.PI / 2;
      group.add(body);

      // Wings
      const wingGeo = new THREE.PlaneGeometry(1.4, 1.8);
      wingGeo.translate(-0.7, 0, 0); // hinge at right edge

      const leftMat = new THREE.MeshStandardMaterial({
        map: leftT,
        transparent: true,
        alphaTest: 0.05,
        side: THREE.DoubleSide,
        roughness: 0.4
      });
      const leftWing = new THREE.Mesh(wingGeo, leftMat);
      group.add(leftWing);

      const rightGeo = new THREE.PlaneGeometry(1.4, 1.8);
      rightGeo.translate(0.7, 0, 0); // hinge at left edge

      const rightMat = new THREE.MeshStandardMaterial({
        map: rightT,
        transparent: true,
        alphaTest: 0.05,
        side: THREE.DoubleSide,
        roughness: 0.4
      });
      const rightWing = new THREE.Mesh(rightGeo, rightMat);
      group.add(rightWing);

      return { group, leftWing, rightWing };
    }

    const b = createButterfly(leftTex, rightTex);
    b.group.position.set(0, 0, 0);
    b.group.scale.set(3, 3, 3);
    b.group.rotation.set(0.4, 0.3, 0.2);
    b.leftWing.rotation.y = 0.5;
    b.rightWing.rotation.y = -0.5;
    scene.add(b.group);

    renderer.render(scene, camera);
    console.log('Butterfly rendered!');
  </script>
</body>
</html>
